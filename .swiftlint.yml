# SwiftLint config for the iOS host app. Run `swiftlint` from the repo root.
included:
  - iosApp
excluded:
  - iosApp/build
  - iosApp/Pods

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 160

type_name:
  # Entry point generated by the KMP wizard and referenced by the Xcode project.
  excluded:
    - iOSApp
